name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    lint-and-typecheck:
        name: Lint & Typecheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run lint
            - run: pnpm run typecheck

    test:
        name: Test (Unit + Integration, DCMTK 3.7.0)
        runs-on: ubuntu-latest
        container:
            image: michaelleehobbs/nodejs-dcmtk:dcmtk-3.7.0-nodejs-24.12.0-alpine3.23
        steps:
            - uses: actions/checkout@v7
            - run: corepack enable && corepack prepare pnpm@10 --activate
            - run: pnpm install --frozen-lockfile
            - run: pnpm run test:all

    # Chocolatey installs DCMTK behind launcher shims, the layout that orphaned DCMTK processes on Windows (#56).
    test-windows:
        name: Test (Windows, Chocolatey DCMTK 3.7.0)
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - run: choco install dcmtk --version=3.7.0 -y --no-progress
            - run: pnpm install --frozen-lockfile
            - run: pnpm run test
            - run: pnpm exec vitest run --config vitest.integration.config.ts test/integration/servers/no-orphans.integration.test.ts

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [lint-and-typecheck, test, test-windows]
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - run: pnpm run dry-run

    audit:
        name: Security Audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm audit --prod
